[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tell-me-your-price"
version = "1.0.0"
description = "Donation-equivalent elicitation and cross-instrument validation of LLM-expressed preferences"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.1",
  "PyYAML>=6.0",
  "requests>=2.31",
  "scipy>=1.11",
  "seaborn>=0.13",
  "statsmodels>=0.14",
  "tqdm>=4.66",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

